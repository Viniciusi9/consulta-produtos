name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  gerar-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev
          python3 -m pip install --user buildozer Cython==0.29.34 virtualenv

      - name: Criar configuração do Android
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Consulta de Produtos
          package.name = consulta
          package.domain = com.i9mundotech
          source.dir = .
          source.include_exts = py,csv,png,jpg,jpeg,kv,atlas
          version = 1.0.0
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 0

          [app:android]
          android.minapi = 23
          android.archs = arm64-v8a
          
          EOF

      - name: Preparar Android SDK e aceitar licenças
        run: |
          ~/.local/bin/buildozer android clean || true
          ~/.local/bin/buildozer -v android debug || true
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses

      - name: Compilar APK
        run: ~/.local/bin/buildozer -v android debug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Consulta-de-Produtos-APK
          path: bin/*.apk
          retention-days: 7
